name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --ignore-scripts @anthropic-ai/claude-code@2.1.310
      - run: node node_modules/@anthropic-ai/claude-code/install.cjs
      - run: npx claude --version
      - run: npm run setup:checks
      - run: npm run check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: node-coverage
          path: tmp/coverage/lcov.info
          if-no-files-found: error
