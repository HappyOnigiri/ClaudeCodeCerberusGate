name: Release

on:
  workflow_dispatch:
    inputs:
      automatic:
        description: "日次実行と同じ自動運用（変更なしのスキップ・自動マージ）"
        required: false
        default: false
        type: boolean
      version:
        description: "リリースするバージョン（空なら bump で判定）"
        required: false
        type: string
      bump:
        description: "バージョンの上げ方（version 指定時は無視）"
        required: false
        default: auto
        type: choice
        options: [auto, major, minor, patch]
  schedule:
    - cron: "17 18 * * *" # 毎日 03:17 JST

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTOMATIC_RELEASE: ${{ github.event_name == 'schedule' || inputs.automatic }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - uses: HappyOnigiri/ReleaseActions/actions/prepare-release@main
        id: prepare
        with:
          version: ${{ inputs.version }}
          bump: ${{ inputs.version != '' && 'none' || inputs.bump || 'auto' }}
          skip-if-no-changes: ${{ env.AUTOMATIC_RELEASE }}
          skip-if-open-release-pr: ${{ env.AUTOMATIC_RELEASE }}
          initial-release: merged-prs
          version-bump-type: json
          json-version-files: |
            plugins/cerberus-gate/.claude-plugin/plugin.json
            plugins/cerberus-gate-display/.claude-plugin/plugin.json
          post-bump-command: |
            set -euo pipefail
            npm ci --ignore-scripts
            npx --no-install oxfmt \
              plugins/cerberus-gate/.claude-plugin/plugin.json \
              plugins/cerberus-gate-display/.claude-plugin/plugin.json
          github-token: ${{ secrets.GH_TOKEN }}

      - uses: HappyOnigiri/ReleaseActions/actions/merge-release@main
        if: env.AUTOMATIC_RELEASE == 'true' && steps.prepare.outputs.pr-number != ''
        with:
          pr-number: ${{ steps.prepare.outputs.pr-number }}
          head-sha: ${{ steps.prepare.outputs.head-sha }}
          workflow: ci.yml
          events: |
            push
            pull_request
          check-name: checks
          timeout-seconds: "600"
          merge-method: merge
          github-token: ${{ secrets.GH_TOKEN }}
